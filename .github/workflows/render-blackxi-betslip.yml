name: Render BLACK XI betslip test

on:
  push:
    paths:
      - 'assets/blackxi/betslip-test.svg'
      - '.github/workflows/render-blackxi-betslip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install sharp@0.33.5
      - name: Render PNG
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          sharp('assets/blackxi/betslip-test.svg')
            .png()
            .toFile('assets/blackxi/betslip-test.png')
            .catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Commit rendered image
        run: |
          git config user.name "blackxi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/blackxi/betslip-test.png
          git diff --cached --quiet || git commit -m "Render BLACK XI betslip PNG"
          git push
